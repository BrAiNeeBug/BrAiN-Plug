substitutions:
  device_name: brainplug
  friendly_name: "pwrbase_brainplug"
  board_type: esp8266
  relay_pin: GPIO0
  led_pin: GPIO0
  button_pin: GPIO0

esphome:
  comment: BrAiN_Plug_1.0.4
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (id(power_mode) == 1) {
            id(relay).turn_on();
          } else if (id(power_mode) == 2) {
            id(relay).turn_off();
          }
          // Mode 0 = Last State: nothing to do, restore_mode already handled it

          // last_switch_time wird automatisch von ESPHome aus dem Flash
          // wiederhergestellt (restore_value: true) - egal ob Soft-Reboot
          // oder echter Stromausfall. Keine RTC-Tricks noetig.

preferences:
  flash_write_interval: 30s

esp8266:
  board: ${board_type}
  board_flash_mode: dout
  restore_from_flash: true
  early_pin_init: false

globals:
  - id: system_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: power_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: timer_mode
    type: int
    restore_value: true
    initial_value: "2"
  - id: last_switch_time
    type: int
    restore_value: true
    initial_value: "0"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: LIGHT

captive_portal:

logger:
  id: logger_id
  level: VERY_VERBOSE
  initial_level: NONE
  runtime_tag_levels: true

select:
  - platform: logger
    name: "LogLevel"
    id: log_level_select

  - platform: template
    name: "PowerONMode"
    id: power_mode_select
    optimistic: true
    restore_value: true
    options:
      - "Last State"
      - "Always ON"
      - "Always OFF"
    initial_option: "Last State"
    on_value:
      then:
        - lambda: |-
            if (x == "Last State") id(power_mode) = 0;
            else if (x == "Always ON") id(power_mode) = 1;
            else if (x == "Always OFF") id(power_mode) = 2;
    web_server:
      sorting_weight: 2

  - platform: template
    name: "TimerMode"
    id: timer_mode_select
    optimistic: true
    restore_value: true
    options:
      - "OFF"
      - "Force"
      - "Normal"
    initial_option: "OFF"
    on_value:
      then:
        - lambda: |
            if (x == "Normal") id(timer_mode) = 0;
            else if (x == "Force") id(timer_mode) = 1;
            else if (x == "OFF") id(timer_mode) = 2;
    web_server:
      sorting_weight: 3

web_server:
  port: 80
  version: 3
  auth:
    password: !secret webgui_password
    username: admin
    type: digest

time:
  - platform: sntp
    id: timesrc

    on_time_sync:
      then:
        - delay: 5s
        - lambda: |-
            id(system_ready) = true;

            // Falls der Zeitstempel noch leer war, initialisieren
            if (id(last_switch_time) <= 0) {
              id(last_switch_time) = (int) id(timesrc).now().timestamp;
            }

            ESP_LOGI("timer", "System ready.");

datetime:
  - platform: template
    type: TIME
    name: "TurnOnTime"
    id: on_time_setting
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    web_server:
      sorting_weight: 4
  - platform: template
    type: TIME
    name: "TurnOffTime"
    id: off_time_setting
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    web_server:
      sorting_weight: 6

interval:
  - interval: 10s
    then:
      - lambda: |
          if (!id(system_ready))
          return;

          auto now = id(timesrc).now();
          if (!now.is_valid())
          return;

          auto on_t = id(on_time_setting).state_as_esptime();
          auto off_t = id(off_time_setting).state_as_esptime();

          if (!on_t.is_valid() || !off_t.is_valid())
          return;

          int now_min = now.hour * 60 + now.minute;
          int on_min  = on_t.hour * 60 + on_t.minute;
          int off_min = off_t.hour * 60 + off_t.minute;

          bool should_be_on;
          if (on_min <= off_min) {
            should_be_on = (now_min >= on_min && now_min < off_min);
          } else {
            should_be_on = (now_min >= on_min || now_min < off_min);
          }

          if (id(timer_mode) == 2) {
            // OFF -> Timer komplett deaktiviert
            return;
          }

          if (id(timer_mode) == 1) {
            // Force
            if (should_be_on)
              id(relay).turn_on();
            else
              id(relay).turn_off();
          } else {
            // Normal
            if (now.hour == on_t.hour && now.minute == on_t.minute && now.second < 10) {
              id(relay).turn_on();
            }

            if (now.hour == off_t.hour && now.minute == off_t.minute && now.second < 10) {
              id(relay).turn_off();
            }
          }

  - interval: 500ms
    then:
      - lambda: |-
          static bool blink_state = false;
          if (!id(wifi_component).is_connected()) {
            blink_state = !blink_state;
            if (blink_state) id(led_out).turn_on();
            else id(led_out).turn_off();
          } else {
            if (id(relay).state) id(led_out).turn_on();
            else id(led_out).turn_off();
          }

text_sensor:
  - platform: template
    name: "SystemClock"
    id: current_time_display
    update_interval: 15s
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};
      char buf[9];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", now.hour, now.minute, now.second);
      return std::string(buf);
    web_server:
      sorting_weight: 9

  - platform: template
    name: "ActualDuration"
    id: relay_duration_display
    update_interval: 30s
    lambda: |-
      if (!id(system_ready))
      return {"NA"};

      auto now = id(timesrc).now();
      if (!now.is_valid())
      return {"NA"};
      int elapsed = (int) now.timestamp - id(last_switch_time);

      // Sanity-Check: negativ oder > 10 Jahre -> last_switch_time war ungueltig (0 o.ae.)
      // dann selbst reparieren statt Muell anzuzeigen
      if (elapsed < 0 || elapsed > 315360000) {
        id(last_switch_time) = (int) now.timestamp;
        elapsed = 0;
      }

      int hours = elapsed / 3600;
      int minutes = (elapsed % 3600) / 60;
      char buf[16];
      snprintf(buf, sizeof(buf), "%dh %dm", hours, minutes);
      return std::string(buf);
    web_server:
      sorting_weight: 8

  - platform: template
    name: "TimerONDuration"
    id: timer_on_duration_display
    update_interval: 30s
    lambda: |-
      auto on_t = id(on_time_setting).state_as_esptime();
      auto off_t = id(off_time_setting).state_as_esptime();

      int on_min = on_t.hour * 60 + on_t.minute;
      int off_min = off_t.hour * 60 + off_t.minute;

      int duration = off_min - on_min;
      if (duration < 0)
        duration += 24 * 60;

      char buf[16];
      snprintf(buf, sizeof(buf), "%.1fh", duration / 60.0);

      return std::string(buf);
    web_server:
      sorting_weight: 5

  - platform: template
    name: "TimerOFFDuration"
    id: timer_off_duration_display
    update_interval: 30s
    lambda: |-
      auto on_t = id(on_time_setting).state_as_esptime();
      auto off_t = id(off_time_setting).state_as_esptime();

      int on_min = on_t.hour * 60 + on_t.minute;
      int off_min = off_t.hour * 60 + off_t.minute;

      int duration = on_min - off_min;
      if (duration < 0)
        duration += 24 * 60;

      char buf[16];
      snprintf(buf, sizeof(buf), "%.1fh", duration / 60.0);

      return std::string(buf);
    web_server:
      sorting_weight: 7

button:
  - platform: restart
    name: "Restart"
    device_class: restart
    entity_category: config

#############################################
##########  Plug: Relay/Button/LED  ##########
#############################################

output:
  - platform: gpio
    pin: ${relay_pin}
    id: relay_out
  - platform: gpio
    pin:
      number: ${led_pin}
      inverted: true
    id: led_out

switch:
  - platform: output
    name: "Switch"
    output: relay_out
    id: relay
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          auto now = id(timesrc).now();
          if (id(system_ready) && now.is_valid()) {
          id(last_switch_time) = (int) now.timestamp;
          global_preferences->sync();
          }
    on_turn_off:
      - lambda: |-
          auto now = id(timesrc).now();
          if (id(system_ready) && now.is_valid()) {
          id(last_switch_time) = (int) now.timestamp;
          global_preferences->sync();
          }
    web_server:
      sorting_weight: 1

binary_sensor:
  - platform: gpio
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    internal: true
    on_press:
      - switch.toggle: relay
