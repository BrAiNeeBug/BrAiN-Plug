#giturl: "https://github.com/BrAiNeeBug/BrAiNPlug"
#base_brainplug_esp32 - ESP32-Port von base_brainplug.yaml (BrAiN_Plug_1.3.1)
substitutions:
  device_name: brainplug
  friendly_name: "pwrbase_brainplug"
  schedule_builder_url: "https://braineebug.github.io/BrAiNPlug/wsb.html"
  esp32_board: esp32dev
  relay_pin: GPIO0
  led_pin: GPIO0
  button_pin: GPIO0
  localdomain: ".local"

esphome:
  comment: BrAiN_Plug_1.3.1_ESP32
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (id(power_mode) == 1) {
            if (!id(relay_physical).state) id(relay_physical).turn_on();
          } else if (id(power_mode) == 2) {
            if (id(relay_physical).state) id(relay_physical).turn_off();
          } else {
            // Last State: nicht auf ESPHomes impliziten restore_mode verlassen,
            // sondern explizit aus unserem eigenen Global setzen
            if (id(relay_state) == 1) {
              if (!id(relay_physical).state) id(relay_physical).turn_on();
            } else {
              if (id(relay_physical).state) id(relay_physical).turn_off();
            }
          }
          // last_switch_time kommt via restore_value bereits aus dem Flash (übersteht
          // JEDEN Reboot, auch Stromverlust). Der Reset auf 0 bei echtem Stromverlust
          // passiert unten im "ResetReason"-TextSensor (debug-Komponente), nicht hier -
          // extern "C"-Deklarationen sind in C++ nur auf Dateiebene erlaubt, nicht
          // innerhalb eines Lambdas/einer Funktion.

preferences:
  flash_write_interval: 30s

esp32:
  board: ${esp32_board}
  variant: esp32
  framework:
    type: esp-idf

globals:
  - id: power_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: timer_mode
    type: int
    restore_value: true
    initial_value: "0"
  - id: last_switch_time
    type: int
    restore_value: true
    initial_value: "0"
  - id: relay_state
    type: int
    restore_value: true
    initial_value: "0"
  - id: weekly_status_str
    type: std::string
    restore_value: false
    initial_value: '""'

ota:
  - platform: esphome
    password: !secret ota_password
   # allow_partition_access: true

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: LIGHT
  domain: ${localdomain}

#mqtt:
#  broker: homeassistant.yourdomain
#  id: mqtt_client
#  username: !secret mqtt_username
#  password: !secret mqtt_password

debug:

captive_portal:

logger:
  id: logger_id
  level: VERY_VERBOSE
  initial_level: NONE
  runtime_tag_levels: true

select:
  - platform: logger
    name: "LogLevel"
    id: log_level_select
    disabled_by_default: true
    icon: "mdi:text-box-search-outline"
    entity_category: diagnostic
  - platform: template
    name: "PowerONMode"
    id: power_mode_select
    optimistic: true
    restore_value: true
    options:
      - "Last State"
      - "Always ON"
      - "Always OFF"
    initial_option: "Last State"
    on_value:
      then:
        - lambda: |-
            if (x == "Last State") id(power_mode) = 0;
            else if (x == "Always ON") id(power_mode) = 1;
            else if (x == "Always OFF") id(power_mode) = 2;
    icon: "mdi:cog-clockwise"
    entity_category: config
  - platform: template
    name: "TimerMode"
    id: timer_mode_select
    optimistic: true
    restore_value: true
    options:
      - "OFF"
      - "Auto"
      - "Single"
      - "WeeklyAuto"
      - "WeeklySingle"
    initial_option: "OFF"
    on_value:
      then:
        - lambda: |
            if (x == "OFF") id(timer_mode) = 0;
            else if (x == "Auto") id(timer_mode) = 1;
            else if (x == "Single") id(timer_mode) = 2;
            else if (x == "WeeklyAuto") id(timer_mode) = 3;
            else if (x == "WeeklySingle") id(timer_mode) = 4;
    icon: "mdi:timer-cog"
    entity_category: config
text:
  - platform: template
    name: "WeeklySchedule"
    id: weekly_schedule_text
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 255
    icon: "mdi:calendar-clock"
    entity_category: config
web_server:
  port: 80
  version: 3
  auth:
    password: !secret webgui_password
    username: admin
    type: digest

time:
  - platform: sntp
    id: timesrc

datetime:
  - platform: template
    type: TIME
    name: "Turn0nTime"
    id: on_time_setting
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    icon: "mdi:lightbulb-on"
    entity_category: config
  - platform: template
    type: TIME
    name: "TurnOffTime"
    id: off_time_setting
    optimistic: true
    restore_value: true
    initial_value: "00:00:00"
    icon: "mdi:lightbulb-off"
    entity_category: config
interval:
  - interval: 10s
    then:
      - lambda: |
          auto now = id(timesrc).now();
          if (!now.is_valid()) return;

          if (id(timer_mode) == 0) {
            // OFF
            return;
          }

          int now_min = now.hour * 60 + now.minute;

          if (id(timer_mode) == 1 || id(timer_mode) == 2) {
            // Auto / Single both use the global TurnOnTime / TurnOffTime fields
            auto on_t  = id(on_time_setting).state_as_esptime();
            auto off_t = id(off_time_setting).state_as_esptime();
            int on_min  = on_t.hour * 60 + on_t.minute;
            int off_min = off_t.hour * 60 + off_t.minute;

            if (on_min == off_min) {
              // On-time equals off-time (e.g. 00:00-00:00) -> nothing configured, no switching.
              // NOTE: this short-circuit only applies to Auto/Single - Weekly mode below has
              // its own per-entry times and must never be skipped because of this.
              return;
            }

            if (id(timer_mode) == 1) {
              // Auto
              int duration = off_min - on_min;
              if (duration <= 0) {
                duration += 24 * 60;
              }

              int elapsed = now_min - on_min;
              if (elapsed < 0) {
                elapsed += 24 * 60;
              }

              bool should_be_on = (elapsed < duration);

              if (should_be_on)
                id(relay_physical).turn_on();
              else
                id(relay_physical).turn_off();
            } else {
              // Single
              if (now.hour == on_t.hour && now.minute == on_t.minute && now.second < 10) {
                id(relay_physical).turn_on();
              }

              if (now.hour == off_t.hour && now.minute == off_t.minute && now.second < 10) {
                id(relay_physical).turn_off();
              }
            }
          }

          if (id(timer_mode) == 3 || id(timer_mode) == 4) {
            // WeeklyAuto (3) / WeeklySingle (4): parse the free-form WeeklySchedule text field.
            // Format: "HHMM-HHMM:Days;HHMM-HHMM:Days;..."
            // Days = any combination of two-letter tokens Su Mo Tu We Th Fr Sa, no separator needed.
            // Example: "0600-0800:MoTuWeThFr;1800-2200:SaSu;1200-1230:We"
            // The SAME schedule text works for both modes - the TimerMode dropdown decides
            // how it's applied:
            //   WeeklyAuto   -> relay held ON continuously for the whole HHMM-HHMM range (classic behaviour)
            //   WeeklySingle -> relay pulses ON once at the start time and OFF once at the end time,
            //                   like TimerMode "Single", no continuous enforcement in between
            // As many entries as fit in the text field (max_length below) - add/remove freely.
            std::string sched = id(weekly_schedule_text).state;
            const char *dow_tok_arr[] = {"", "Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"};
            std::string dow_tok = dow_tok_arr[now.day_of_week];

            bool should_be_on = false;
            int matched_today = 0;
            size_t pos = 0;
            while (pos <= sched.size()) {
              size_t sep = sched.find(';', pos);
              std::string entry = (sep == std::string::npos) ? sched.substr(pos) : sched.substr(pos, sep - pos);
              pos = (sep == std::string::npos) ? sched.size() + 1 : sep + 1;

              while (!entry.empty() && entry.front() == ' ') entry.erase(entry.begin());
              while (!entry.empty() && entry.back() == ' ') entry.pop_back();
              if (entry.empty()) continue;

              size_t colon = entry.find(':');
              if (colon == std::string::npos) continue;
              std::string range = entry.substr(0, colon);
              std::string days = entry.substr(colon + 1);

              size_t dash = range.find('-');
              if (dash == std::string::npos) continue;
              std::string on_str = range.substr(0, dash);
              std::string off_str = range.substr(dash + 1);
              if (on_str.size() != 4 || off_str.size() != 4) continue;
              if (days.find(dow_tok) == std::string::npos) continue;

              int e_on_min = std::stoi(on_str.substr(0, 2)) * 60 + std::stoi(on_str.substr(2, 2));
              int e_off_min = std::stoi(off_str.substr(0, 2)) * 60 + std::stoi(off_str.substr(2, 2));
              if (e_on_min == e_off_min) continue;

              matched_today++;

              if (id(timer_mode) == 4) {
                // WeeklySingle: pulse only, no continuous enforcement
                int e_on_hour = e_on_min / 60, e_on_minute = e_on_min % 60;
                int e_off_hour = e_off_min / 60, e_off_minute = e_off_min % 60;

                if (now.hour == e_on_hour && now.minute == e_on_minute && now.second < 10) {
                  id(relay_physical).turn_on();
                }
                if (now.hour == e_off_hour && now.minute == e_off_minute && now.second < 10) {
                  id(relay_physical).turn_off();
                }
              } else {
                // WeeklyAuto: continuous range enforcement
                int e_duration = e_off_min - e_on_min;
                if (e_duration <= 0) e_duration += 24 * 60;
                int e_elapsed = now_min - e_on_min;
                if (e_elapsed < 0) e_elapsed += 24 * 60;

                if (e_elapsed < e_duration) should_be_on = true;
              }
            }

            if (id(timer_mode) == 3) {
              // Only WeeklyAuto forces the relay every tick. WeeklySingle never does -
              // it only fires the pulses above, so it never fights with itself 10s later.
              if (should_be_on) id(relay_physical).turn_on();
              else id(relay_physical).turn_off();
            }

            char status_buf[48];
            snprintf(status_buf, sizeof(status_buf), "%d entries today, relay %s",
                     matched_today, id(relay_physical).state ? "ON" : "OFF");
            id(weekly_status_str) = std::string(status_buf);
          }

  - interval: 500ms
    then:
      - lambda: |-
          static bool blink_state = false;
          if (!id(wifi_component).is_connected()) {
            blink_state = !blink_state;
            if (blink_state) id(led_out).turn_on();
            else id(led_out).turn_off();
          } else {
            if (id(relay_physical).state) id(led_out).turn_on();
            else id(led_out).turn_off();
          }

text_sensor:
  - platform: debug
    reset_reason:
      id: reset_reason_sensor
      internal: true
      on_value:
        then:
          - lambda: |-
              // Läuft einmalig beim Boot. Nur bei echtem Stromverlust
              // (Power-On/Brownout) last_switch_time zurücksetzen - Soft-Reboot/
              // OTA/Restart-Button/WLAN-Reconnect lassen den Wert unangetastet.
              std::string r = x;
              for (auto &c : r) c = tolower(c);
              if (r.find("power on") != std::string::npos || r.find("brownout") != std::string::npos) {
                id(last_switch_time) = 0;
              }
  - platform: template
    name: "ScheduleBuilderURL"
    id: wsb
    icon: "mdi:web"
    entity_category: diagnostic
    lambda: |-
      return {"${schedule_builder_url}"};
    disabled_by_default: true
  - platform: template
    name: "SystemClock"
    id: current_time_display
    icon: "mdi:clock-outline"
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};
      char buf[9];
      snprintf(buf, sizeof(buf), "%02d:%02d:%02d", now.hour, now.minute, now.second);
      return std::string(buf);
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "ActualDuration"
    id: relay_duration_display
    lambda: |-
      auto now = id(timesrc).now();
      if (!now.is_valid()) return {"NA"};

      int elapsed = (int) now.timestamp - id(last_switch_time);

      if (elapsed < 0 || elapsed > 315360000) {
        return std::string("PwrLoss");
      }

      int hours = elapsed / 3600;
      int minutes = (elapsed % 3600) / 60;

      char buf[16];
      snprintf(buf, sizeof(buf), "%dh %dm", hours, minutes);
      return std::string(buf);
    icon: "mdi:run"
    web_server:
      sorting_weight: 6
  - platform: template
    name: "WeeklyStatus"
    id: weekly_status_display
    icon: "mdi:calendar-check-outline"
    lambda: |-
      return id(weekly_status_str);
    entity_category: diagnostic
    disabled_by_default: true
  - platform: template
    name: "Timer0NDuration"
    id: timer_on_duration_display
    update_interval: 5s
    lambda: |-
      auto on_t = id(on_time_setting).state_as_esptime();
      auto off_t = id(off_time_setting).state_as_esptime();
      int on_min = on_t.hour * 60 + on_t.minute;
      int off_min = off_t.hour * 60 + off_t.minute;
      int duration = off_min - on_min;
      if (duration < 0) duration += 24 * 60;
      char buf[8];
      snprintf(buf, sizeof(buf), "%.1fh", floor(duration / 60.0 * 10) / 10.0);
      return std::string(buf);
    icon: "mdi:emoticon-cool"
    web_server:
      sorting_weight: 7
  - platform: template
    name: "TimerOFFDuration"
    id: timer_off_duration_display
    update_interval: 5s
    lambda: |-
      auto on_t = id(on_time_setting).state_as_esptime();
      auto off_t = id(off_time_setting).state_as_esptime();
      int on_min = on_t.hour * 60 + on_t.minute;
      int off_min = off_t.hour * 60 + off_t.minute;
      int duration = on_min - off_min;
      if (duration < 0) duration += 24 * 60;
      char buf[8];
      snprintf(buf, sizeof(buf), "%.1fh", floor(duration / 60.0 * 10) / 10.0);
      return std::string(buf);
    icon: "mdi:weather-night"
    web_server:
      sorting_weight: 8
button:
  - platform: restart
    name: "Restart"
    device_class: restart
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:restart"

#############################################
##########  Plug: Relay/Button/LED  ##########
#############################################

output:
  - platform: gpio
    pin: ${relay_pin}
    id: relay_out
  - platform: gpio
    pin:
      number: ${led_pin}
      inverted: true
      ignore_strapping_warning: true
    id: led_out

switch:
  - platform: output
    name: "RelayPhysical"
    output: relay_out
    id: relay_physical
    internal: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(relay_state) = 1;
          auto now = id(timesrc).now();
          if (now.is_valid()) {
            id(last_switch_time) = (int) now.timestamp;
          }
          global_preferences->sync();
          id(relay).publish_state(true);
    on_turn_off:
      - lambda: |-
          id(relay_state) = 0;
          auto now = id(timesrc).now();
          if (now.is_valid()) {
            id(last_switch_time) = (int) now.timestamp;
          }
          global_preferences->sync();
          id(relay).publish_state(false);
  - platform: template
    name: "Switch"
    id: relay
    restore_mode: DISABLED  # reiner Anzeige-/Gate-Layer, echter Zustand kommt von relay_physical
    icon: "mdi:power-socket-eu"
    turn_on_action:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Turn ON blocked - ChildLock active");
            id(relay).publish_state(id(relay_physical).state);
          } else {
            id(relay_physical).turn_on();
          }
    turn_off_action:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Turn OFF blocked - ChildLock active");
            id(relay).publish_state(id(relay_physical).state);
          } else {
            id(relay_physical).turn_off();
          }
    web_server:
      sorting_weight: 1
  - platform: template
    name: "ChildLock"
    id: child_lock
    icon: "mdi:lock"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    web_server:
      sorting_weight: 2
binary_sensor:
  - platform: gpio
    pin:
      number: ${button_pin}
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    icon: "mdi:gesture-tap-button"
    internal: true
    on_press:
      - lambda: |-
          if (id(child_lock).state) {
            ESP_LOGW("childlock", "Button press blocked - ChildLock active");
          } else {
            if (id(relay_physical).state) id(relay_physical).turn_off();
            else id(relay_physical).turn_on();
          }
